name: Collect energy data
on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -f -X POST ${{ vars.COLLECT_URL }} \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}"

  # Holder workflowen aktiv: GitHub deaktiverer planlagte (cron) workflows
  # etter 60 dager uten repo-aktivitet. Denne jobben re-aktiverer workflowen
  # via GitHub CLI hver kjøring (preemptivt), så den aldri blir deaktivert.
  # Ingen tredjepartskode, ingen tomme commits.
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh workflow enable collect.yml
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
